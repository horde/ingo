2.0.0-BETA1:
  notes: "Original version string was 2.0-BETA1\n[jan] Fix creating new rules with PostgreSQL (Bug #9638).\n"
2.0.0-ALPHA1:
  notes: "Original version string was 2.0-ALPHA1\n[jan] Provide default configuration files instead of .dist versions.\n[jan] Rename 'driver' configuration and classes to 'transport' to avoid confusion with script and storage drivers.\n[mms] Use IMP API for IMAP actions.\n[mms] Convert to Horde 4 standards.\n"
1.2.6:
  notes: "[mms] Fix encoding of vacation message in maildrop driver (Bug #9532).\n[jan] Add upgrade scripts for next-generation SQL share driver.\n"
1.2.5:
  notes: "[jan] Fix procmail vacation rule if no dates are set (Gaudenz Steinlin <gaudenz@debian.org>, Bug #8982).\n[jan] Fix filtering only unseen message if rule should filter all messages in IMAP driver (Jan Kuipers <jrkuipers@lauwerscollege.nl>, Bug #9077).\n"
1.2.4:
  notes: "[jan] Correctly escape addresses in procmail driver (Bug #8875).\n[jan] Fix procmail scripts when using composite headers (Bug #8804).\n[jan] Support some non-standard Date: headers in Sieve vacation rules (Request #8783).\n[jan] Support composite header rules with IMAP backends (Request #7343).\n[jan] Fix unconditional debug output with Net_Sieve earlier than 1.2.0 (Bug #8794).\n[jan] Add Sieve configuration to use UTF-8 encoded folder names (for Dovecot) (Request #7391).\n"
1.2.3:
  notes: "[jan] Log Sieve communication with DEBUG log level.\n[jan] Fix Oracle SQL scripts.\n[jan] Add Croatian translation (Matej Vela <matej.vela@carnet.hr>).\n[jan] Add PostgreSQL-specific upgrade script (Request #8630).\n[jan] Fix procmail vacation rule (micha@kovoks.nl, Bug #7052).\n[jan] Prevent deadlock with vacation rule in maildrop driver (Bug #8577).\n"
1.2.2:
  notes: "[mms] Upgrade prototype.js to v1.6.1.\n[jan] Correctly match negative header values with numeric comparison in Sieve driver (bb@apc.ag, Bug #7308).\n[jan] Implement removeUserData API (adrieder@sbox.tugraz.at, Request #8452).\n[jan] Take default settings for forwards, vacation and spam rules from config/prefs.php in the SQL storage driver.\n[jan] No longer try to read spam folder from IMP's preferences.\n[jan] Fix maildrop rules without conditions (almarin@um.es, Bug #8103).\n[cjh] Fix checks for the forward_file and forward_script procmail parameters in the VFS driver (Bug #7811).\n[cjh] Add %d (domain) as a replaceable variable in the vfs_path parameter (dev@stean.ch, Request #7503).\n[jan] Make it easier to select the \"Create new folder\" entry for target folders (Bug #7768).\n[cjh] Fix reading the current script in the VFS driver (rsalmon@mbpgroup.com, Bug #7610).\n[cjh] Maildrop vacation rule: don't reply to bulk/list messages, add start/end times, better character support in the message, allow subsequent rules to execute (rsalmon@mbpgroup.com, Bug #7140).\n[cjh] Fix compound header tests in the procmail and maildrop drivers (rsalmon@mbpgroup.com, Bugs #7117, #7611).\n[jan] Change group field in shares table to work with LDAP groups (Bug #6883).\n"
1.2.1:
  notes: "[jan] Don't show script icon in menu if preference to automatically update scripts is both set and locked (Request #7251).\n[jan] Fix adding more than 5 wildcard blacklists (Bug #7077).\n[jan] Add Basque translation (Euskal Herriko Unibertsitatea EHU/UPV <xabier.arrieta@ehu.es>).\n[jan] Fix saving spam rules in the preference backend (Bug #7033).\n[jan] Correctly catch dates before the 10th of a month in Sieve timed vacations (Bug #7023).\n[mas] Fix vacation with procmail driver (Bugs #6509, #7052).\n[jan] Fix moving to INBOX with the maildrop driver.\n[jan] Disable drop down entries with informational purpose only.\n[jan] Fix filter activity messages with non-ASCII folder names (taguchi@iij.ad.jp, Bug #6764).\n"
1.2.0:
  notes: "Original version string was 1.2\n[cjh] Improve resource usage in datatree_to_sql share migration script (Bug #6740).\n"
1.2.0-RC3:
  notes: "Original version string was 1.2-RC3\n[cjh] Apply fix for http://dev.rubyonrails.org/ticket/11473 to prototype.js (Request #6590).\n[cjh] Procmail driver: make the directory in which vacation files are generated configurable (jas@cse.yorku.ca, Request #6643).\n[cjh] Add an upgrade script for the new SQL share driver (Request #6109).\n[cjh] Procmail driver: include the original email subject in vacation replies (Michael.Redinger@uibk.ac.at, Request #6432).\n[cjh] Make the procmail delivery agent configurable, allow configuring a prefix for mailboxes (+ is needed for dmail, for example), don't generate empty VFS files, write a .forward file if needed to pass mail to procmail (Michael.Redinger@uibk.ac.at, Request #6433).\n[jan] Add Slovak translation (Martin Matuška <martin@matuska.org>).\n[cjh] Make the command line utilities called from procmail configurable (Michael.Redinger@uibk.ac.at, Request #6431).\n[jan] Fix creating of duplicate special rules when converting from preferences to SQL storage backend (Bug #6182).\n[jan] Follow Sieve specifications more closely when disabling Sieve scripts (Bug #6337).\n[jan] Load default set of filters for SQL storage from config/prefs.php (tinu@humbapa.ch, Request #6096).\n[jan] Add Russian translation (Alexey Zakharov <baber@mosga.net>).\n"
1.2.0-RC2:
  notes: "Original version string was 1.2-RC2\n[cjh] Add API methods for setting and disabling vacation rules (duck@obala.net).\n[mas] Fix procmail metacharacter quoting. (Bug #5581)\n[cjh] Fix procmail vacation recipe (Volker Then <horde32@volkerthen.com>).\n[cjh] Fix position of closing quote in maildrop driver (laxis@magex.hu, Bug #6020).\n[jan] Fix paths in the script for converting to SQL storage (Bug #5957).\n"
1.2.0-RC1:
  notes: "Original version string was 1.2-RC1\n[cjh] Allow specifying permissions to set in the VFS for uploaded scripts (steinkel@ctinetworks.com, Request #5871).\n[cjh] Add spam filter actions and numeric comparisons to the Maildrop script driver (Request #5843).\n[cjh] Maildrop driver improvements: make INBOX-stripping configurable; fix REJECT action; and add is, not is, not contain, not begins with, not ends with, matches, not matches, exists, and not exists rules (horde@nospam.obeliks.de, Request #5816).\n[jan] Add Japanese translation (Hiromi Kimura <hiromi@tac.tsukuba.ac.jp>).\n[jan] Improve forward rule generation with sieve scripts (Request #5746).\n[jan] Move all Ingo-specific hook examples from Horde's config/ directory.\n[cjh] Only expunge messages that we have moved or deleted completely when using IMAP filters (Bug #4749).\n[cjh] Fix behavior of IMAP stop-script rules (Bug #5539).\n[cjh] Shouldn't show an input field for exists or not exists tests (Bug #5659).\n[cjh] Don't let users save rules with empty conditions (Bug #5641).\n[cjh] Match email addresses exactly for procmail vacation rules, and include the Cc: and Bcc: fields in checks for which address the message was sent to (Bug #4333).\n[cjh] Ingo now provides a Postfix policy daemon that can be used to enforce blacklist and whitelist rules at delivery time (Request #4904).\n[cjh] Autocreate VFS paths when saving rules (stevekwok@hotmail.com>).\n"
1.2.0-ALPHA1:
  notes: "Original version string was 1.2-ALPHA\n[cjh] Add reverse conditions for procmail (horde@coursimault.com, Request #4037).\n[cjh] Allow numeric spam score comparisons with Sieve (adrieder@sbox.tugraz.at, Request #3837).\n[jan] Add Ukrainian translation (Andriy Kopystyansky <anri@polynet.lviv.ua>).\n[cjh] Add timed vacation messages (groente@puscii.nl, Request #4938).\n[mas] Add body test for sieve (michael.menge@zdv.uni-tuebingen.de, Request #3875).\n[mas] Change 'Important' flag to 'Flagged For Followup' to match IMP.\n[jan] Add full character set support to vacation messages in maildrop and procmail drivers (Requests #4034, #4989).\n[cjh] Add sivtest driver (liamr@deathstar.org, Request #4777).\n[cjh] Add maildrop vacation support (jrvs@bothends.org, Request #3722).\n[jan] Add hook to provide addresses for vacation messages (Request #4542).\n[jan] Add \"Save and Enable/Disable\" buttons to forward, vacation, and spam screens (Request #4543).\n[jan] Group vacation settings in tabs (Request #4541).\n[mas] Conform to WCAG 1.0 Priority 2/Section 508 accessibility guidelines. (Request #4080)\n[mas] Check sieve quota before uploading a script. (gergely@risko.hu, Request #4278)\n[jmf] Blacklist and whitelist for imap scripts now work consistently with sieve scripts -- must match full address.\n[ben] Add body test for procmail (horde@coursimault.com, Requests #3874, #4035).\n[cjh] Add ssh2 to the supported VFS backends (Cliff Green <green@umdnj.edu>).\n[cjh] Add checks to avoid mail loops in the procmail forwards code (Request #3502).\n[jan] Use Horde_Form API to generate special rule forms.\n[jan] Add multidomain support for Kolab servers (tokoe@kde.org, Request #3579).\n[jan] Add support for changing other users' filter rules.\n[jan] Add SQL storage driver.\n[jmf] Add simple spam-filtering setup page.\n"
1.1.5:
  notes: "[jan] Add Japanese translation (Hiromi Kimura <hiromi@tac.tsukuba.ac.jp>).\n[jan] Improve forward rule generation with sieve scripts (Request #5746).\n"
1.1.4:
  notes: "[jan] Add Simplified Chinese translation (Anna Chen <annachen2008@yahoo.com.cn>).\n[cjh] Fix check for bulk or list precedence in Sieve vacation (Bug #5543).\n[jan] Add additional checks to avoid adding empty test values (Bug #5392).\n[jan] Fix multiline vacation messages with procmail driver (Bug #5273).\n"
1.1.3:
  notes: "[jan] Fix blacklists and whitelists in the IMAP driver.\n"
1.1.2:
  notes: "[ben] SECURITY: Make sure folder names are properly escaped in procmail driver to prevent local code execution (Bug #4513).\n[jan] Match all messages with Sieve driver if not providing any criteria (gergely@risko.hu, Bug #4345).\n[jan] Add parameter to enable or disable TLS in timsieved driver (Marcus Hüwe <suse-tux@gmx.de, Request #4496).\n[jan] Correctly align all up arrows in filter list (Bug #4294).\n[jan] Fix compound header fields in Sieve scripts (Bug #4238).\n[jan] Add Catalan translation (Jordi Giralt <projecte.k2@upcnet.es>).\n[jan] Add Slovenian translation (Duck <duck@obala.net>).\n"
1.1.1:
  notes: "[jan] Enable filter setting to stop further filtering by default.\n[jan] Correctly escape forward slashes in maildrop driver (Bug #3514).\n[jan] Add additional checks to avoid adding empty test values (Bug #3313).\n[jan] Add Estonian translation (Toomas Aas <toomas.aas@mail.ee>).\n[jan] Add Greek translation (Konstantinos C. Milosis <kmilosis@yahoo.com>).\n[mms] Fix backward compatibility break with Ingo 1.1 and Horde < 3.1.\n[cjh] Add missing stripe.js (Bug #3623).\n"
1.1.0:
  notes: "Original version string was 1.1\n[jan] Automatically add missing special rules when editing them (Bug #3325).\n"
1.1.0-RC1:
  notes: "Original version string was 1.1-RC1\n[jan] Add portal block for special rules (Oliver Kuhl <okuhl@netcologne.de>, Request #3106).\n[jan] Add Portuguese translation (Manuel Menezes de Sequeira <Manuel.Sequeira>).\n[cjh] Fix escaping of output in several cases.\n[mas] Add notify rule. (Paul Wolstenholme <wolstena@sfu.ca>, Bug #1139)\n[jan] Add Turkish translation (METU <horde-tr@metu.edu.tr>).\n[jan] Don't activate script if exceeded blacklist/whitelist limits (Bug #1166).\n[jan] Add Danish translation (Brian Truelsen <horde+i18n@briantruelsen.dk>).\n[jan] Allow to use a single user for VFS drivers (maddog2k@maddog2k.net, Request #2324).\n[jan] Allow to move rules by specifying their positions (Gergely Risko <gergely@risko.hu>, Request #1060).\n[mas] Add flag-only rule. (Request #1114)\n[ben] Hide procmail vacation db files\n[mms] Add maildrop script driver (Matt Weyland <mathias@weyland.ch>).\n[ben] Add support for '^TO_' procmail rule matching.\n[ben] Add support for special headers on a per-driver basis.\n[jmf] Add support for storing Sieve rules in LDAP (Supports Sun JES/ONE and iPlanet messaging servers).\n[jan] Add permissions to restrict filter rule creation.\n"
1.0.2:
  notes: "[jan] Add Korean translation (Jinhyok Heo <novembre@ournature.org>).\n"
1.0.2-RC1:
  notes: "[jan] Convert rules from Ingo 1.0 with multibyte characters (Bug #1282).\n[jan] Always encode Sieve scripts in UTF-8 and MIME encode subject of vacation messages (Gergely Risko <gergely@risko.hu>, Bug #2121).\n[cjh] Don't escape \"\\\" in Sieve regex mode (Bug #2134).\n[jan] Don't allow empty addresses in blacklists and whitelists (Bug #2165).\n[jan] Really show the active script if clicking that button (Bug #2135).\n[jan] Fix migration script for IMP filters to not include folder rules from already migrated users (Bug #2114).\n[jan] Fix creating of non-ascii IMAP folder names (Bug #2054).\n[jan] Fix regular expression rules that contain commas (Bug #1904).\n[mas] Allow the disabling of blacklist, whitelist, vacation, and forward (Request #1164).\n[jan] Allow message flags with all sieve rules that keep the message (Bug #1292).\n[jan] Add Norwegian Bokmaal translation (Trond Bjørstad <trb@ndn.no>, Thomas Chr. Dahl <tcd@ndn.no>).\n[jan] Change whitelist rule for Sieve to not apply any further rules (Bug #1378).\n[jan] Add shortcut icon (favicon.ico).\n[ben] Fix procmail forwarding. (hager (at) fh-rosenheim (dot) de, Bug #1125)\n[jan] Allow to specify multiple values with \"Begins/Ends With\" tests (Todd Merritt <tmerritt@email.arizona.edu>, Bug #1105).\n"
1.0.1:
  notes: "[jan] Fix blacklist conversion in IMP-to-Ingo conversion script (Steve Lidie <sol0@Lehigh.EDU>).\n[jan] Fix filter rules with multibyte characters.\n"
1.0.0:
  notes: "Original version string was 1.0\n[jan] Add Brazilian Portuguese translation (Fabio Gomes <flgomes@fazenda.sp.gov.br>).\n"
1.0.0-RC2:
  notes: "Original version string was 1.0-RC2\n[jan] Add Czech translation (Pavel Chytil <pavel@chytil.tk>).\n[cjh] Show menu in Script view (Bug #843).\n"
1.0.0-RC1:
  notes: "Original version string was 1.0-RC1\n[cjh] Update icons.\n[jan] Disable Kolab backends if disabled globally.\n"
1.0.0-BETA1:
  notes: "Original version string was 1.0-BETA\n[jan] Add Spanish translation (Manuel Perez Ayala <mperaya@alcazaba.unex.es>).\n[jan] Add vacation support to procmail driver (Micha Kersloot <micha@kovoks.nl>).\n"
1.0.0-ALPHA1:
  notes: "Original version string was 1.0-ALPHA\n[mms] Add configuration option to limit total number of blacklist/whitelist entries a user can have.\n[jan] Allow setting up a global user in the backends configuration (Martin Luethi <horde@humbapa.ch>).\n[mms] Allow user to deactivate script.\n[mms] Add support to filter by body contents for IMAP driver.\n[mms] Allow user-defined filters for the procmail driver (Ben Chavet <ben@chavet.net>).\n[mms] Allow user-specified Headers to be used for filtering.\n[mms] The storage system has been abstracted out to allow for multiple backend storage drivers.\n[mms] Removed all 'show_*' preferences - all available actions will be shown on the menu by default.\n[mms] Added the forward action (Todd Merritt <tmerritt@email.arizona.edu>).\n[mms] On demand filters can now apply to exclusively seen or unseen messages.\n[mms] Rules can now be disabled (Todd Merritt <tmerritt@email.arizona.edu>).\n[mms] Added relational, regex, and matches tests to Sieve script (Todd Merritt <tmerritt@email.arizona.edu>).\n[mms] Honor other module's handling of blacklist/whitelist.\n[mms] Don't show script options if the underlying Ingo_Script:: driver doesn't use them.\n[mms] Case sensitive searches only allowed for Ingo_Script:: drivers that can handle them.\n[mms] 'blacklist_folder' preference now handled inside the 'blacklist' preference.\n[mms] Added 'show_filter_msg' preference - for use with Horde_Script:: backends that support on demand filtering.\n[mms] Added the 'mail/canApplyFilters' API call.\n[mms] Ingo_Storage:: now handles all session caching.\n[mms] Added IMAP client side Ingo_Script:: driver.\n"
0.1.0:
  notes: "Original version string was 0.1\n[jan] Add Swedish translation (Anders Norrbring <anders@norrbring.biz>).\n[jan] Add Lithuanian translation (Vilius Sumskas <vilius@lnk.lt>).\n[jan] Add Italian translation (Marko Djukic <marko@oblo.com>).\n[jan] Add Hungarian translation (Attila Nagy <bra@fsn.hu>).\n[mms] Add Dutch translation (Ruben van der Steenhoven <ruben_donotspamme@webmeesters.net>).\n[jan] Add Finnish translation (Leena Heino <Leena.Heino@uta.fi>).\n[mms] Added the 'mail/applyFilters' API call.\n[bjn] Add whitelist functions.\n[jan] Add German translation.\n[mms] Blacklisted addresses now stored in the storage backend in array format.\n[mms] Added Ingo_Storage:: driver to allow for storage of rules in various backends.\n[bjn] Abstract Script class, and procmail script support.\n[jan] Add Polish translation (Przemyslaw \"Primo\" Witek <primo@npl.pl>).\n[jan] Add Romanian translation (Eugen Hoanca <eugenh@urban-grafx.ro>).\n[jan] Let the users select what should happen to emails from blacklisted addresses.\n[jan] Add Traditional Chinese translation (David Chang <david@thbuo.gov.tw>).\n[jan] Add French translation (Florent Aide <faide@alphacent.com>).\n[jan] Add an API for Ingo.\n[mac] Add a user preference to automatically update the script after a change.\n[mac] Add a user preference to hide the script icon.\n[mac] Fix some regex in the script generation\n[jan] Default to first backend if no preferred backend is specified/found.\n[mac] Initial Commit.\n"
